<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDoS Detection Dashboard</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; color: #58a6ff; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 { font-size: 0.8rem; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; }
    .card .value { font-size: 2rem; font-weight: 700; }
    .card.danger .value { color: #f85149; }
    .card.safe .value { color: #3fb950; }
    .card.info .value { color: #58a6ff; }
    .section { padding: 0 32px 32px; }
    .section h2 { font-size: 1rem; color: #8b949e; margin-bottom: 12px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 8px 12px; color: #8b949e; font-weight: 600; border-bottom: 1px solid #30363d; }
    td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
    tr:hover td { background: #1c2128; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.attack { background: #3d1a18; color: #f85149; }
    .badge.normal { background: #1a3022; color: #3fb950; }
    .predict-form {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin: 0 32px 32px;
    }
    .predict-form h2 { font-size: 1rem; color: #8b949e; margin-bottom: 16px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .fields label { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: #8b949e; }
    .fields input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 6px 8px;
      color: #c9d1d9;
      font-size: 0.85rem;
    }
    .fields input:focus { outline: none; border-color: #58a6ff; }
    .btn {
      margin-top: 16px;
      background: #238636;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:hover { background: #2ea043; }
    #predict-result {
      margin-top: 12px;
      font-size: 0.95rem;
      min-height: 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="dot" id="status-dot"></div>
  <h1>DDoS Detection System &mdash; Live Dashboard</h1>
</header>

<div class="grid">
  <div class="card info">
    <h2>Total Packets</h2>
    <div class="value" id="stat-packets">0</div>
  </div>
  <div class="card danger">
    <h2>Attacks Detected</h2>
    <div class="value" id="stat-attacks">0</div>
  </div>
  <div class="card safe">
    <h2>Normal Traffic</h2>
    <div class="value" id="stat-normal">0</div>
  </div>
  <div class="card info">
    <h2>Attack Rate</h2>
    <div class="value" id="stat-rate">0%</div>
  </div>
</div>

<div class="section">
  <h2>Recent Alerts</h2>
  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Source IP</th>
        <th>Protocol</th>
        <th>Service</th>
        <th>Confidence</th>
        <th>Label</th>
      </tr>
    </thead>
    <tbody id="alerts-tbody">
      <tr><td colspan="6" style="color:#8b949e; text-align:center; padding:24px;">
        Waiting for detections…
      </td></tr>
    </tbody>
  </table>
</div>

<div class="predict-form">
  <h2>Manual Prediction (Single Connection)</h2>
  <form id="predict-form">
    <div class="fields">
      <label>duration <input name="duration" type="number" value="0" /></label>
      <label>protocol_type <input name="protocol_type" type="number" value="1" /></label>
      <label>service <input name="service" type="number" value="21" /></label>
      <label>flag <input name="flag" type="number" value="9" /></label>
      <label>src_bytes <input name="src_bytes" type="number" value="491" /></label>
      <label>dst_bytes <input name="dst_bytes" type="number" value="0" /></label>
      <label>wrong_fragment <input name="wrong_fragment" type="number" value="0" /></label>
      <label>hot <input name="hot" type="number" value="0" /></label>
      <label>logged_in <input name="logged_in" type="number" value="0" /></label>
      <label>num_compromised <input name="num_compromised" type="number" value="0" /></label>
      <label>count <input name="count" type="number" value="1" /></label>
      <label>srv_count <input name="srv_count" type="number" value="1" /></label>
      <label>serror_rate <input name="serror_rate" type="number" step="0.01" value="0.0" /></label>
      <label>srv_serror_rate <input name="srv_serror_rate" type="number" step="0.01" value="0.0" /></label>
      <label>rerror_rate <input name="rerror_rate" type="number" step="0.01" value="0.0" /></label>
    </div>
    <button class="btn" type="submit">Predict</button>
    <div id="predict-result"></div>
  </form>
</div>

<script>
  const socket = io();

  socket.on('connect', () => {
    document.getElementById('status-dot').style.background = '#3fb950';
  });
  socket.on('disconnect', () => {
    document.getElementById('status-dot').style.background = '#f85149';
  });

  socket.on('stats', (s) => {
    document.getElementById('stat-packets').textContent = s.packets;
    document.getElementById('stat-attacks').textContent = s.attacks;
    document.getElementById('stat-normal').textContent = s.normal;
    const rate = s.packets > 0 ? (s.attacks / s.packets * 100).toFixed(1) : '0';
    document.getElementById('stat-rate').textContent = rate + '%';
  });

  socket.on('alert', (a) => addAlertRow(a));

  function addAlertRow(a) {
    const tbody = document.getElementById('alerts-tbody');
    if (tbody.querySelector('td[colspan]')) tbody.innerHTML = '';
    const tr = document.createElement('tr');
    const label = a.label || 'ATTACK';
    const cls = label === 'ATTACK' ? 'attack' : 'normal';
    tr.innerHTML = `
      <td>${a.timestamp}</td>
      <td>${a.src_ip}</td>
      <td>${a.protocol}</td>
      <td>${a.service}</td>
      <td>${(a.confidence * 100).toFixed(1)}%</td>
      <td><span class="badge ${cls}">${label}</span></td>
    `;
    tbody.insertBefore(tr, tbody.firstChild);
    if (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
  }

  // Load existing alerts on page load
  fetch('/api/alerts').then(r => r.json()).then(alerts => {
    alerts.forEach(addAlertRow);
  });

  // Manual prediction form
  document.getElementById('predict-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {};
    fd.forEach((v, k) => body[k] = parseFloat(v));
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    const el = document.getElementById('predict-result');
    if (data.error) {
      el.innerHTML = `<span style="color:#f85149">Error: ${data.error}</span>`;
    } else {
      const cls = data.label === 'ATTACK' ? '#f85149' : '#3fb950';
      el.innerHTML = `Result: <strong style="color:${cls}">${data.label}</strong> &mdash; Confidence: ${(data.confidence*100).toFixed(2)}%`;
    }
  });
</script>
</body>
</html>
