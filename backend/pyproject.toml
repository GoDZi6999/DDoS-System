# Tool configuration only; runtime dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise shadow the package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and use fixed, fake credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# sentinel_ml (shared features + inference, for /v2/detect) lives in ../ml.
pythonpath = [".", "../ml"]
addopts = "-ra"
