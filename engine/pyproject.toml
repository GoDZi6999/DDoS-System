# Tool configuration; dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# sentinel_ml (shared features + inference) lives in ../ml.
pythonpath = [".", "../ml"]
addopts = "-ra"
filterwarnings = ["ignore::PendingDeprecationWarning:shap.*"]
